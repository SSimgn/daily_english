<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1e293b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Daily30" />
  <title>Daily 30 English - 30일 실전 회화 & 연음 완성</title>

  <!-- Google Fonts & Tailwind CSS CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- PWA Dynamic Web App Manifest Injection -->
  <script>
    const manifestJson = {
      name: "Daily 30 English Master",
      short_name: "Daily30",
      description: "하루 30분 실전 직장인 회화, 연음 훈련 & 자동 30일 루틴",
      start_url: "./index.html",
      display: "standalone",
      background_color: "#0f172a",
      theme_color: "#1e293b",
      icons: [
        {
          src: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' fill='%233b82f6'><rect width='512' height='512' rx='120' fill='%232563eb'/><text x='50%' y='58%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-size='240' font-weight='bold' fill='white'>30</text></svg>",
          sizes: "512x512",
          type: "image/svg+xml",
          purpose: "any maskable"
        }
      ]
    };
    const blob = new Blob([JSON.stringify(manifestJson)], { type: 'application/json' });
    const linkTag = document.createElement('link');
    linkTag.rel = 'manifest';
    linkTag.href = URL.createObjectURL(blob);
    document.head.appendChild(linkTag);
  </script>

  <style>

      font-family: 'Plus Jakarta Sans', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .safe-top {
      padding-top: env(safe-area-inset-top, 14px);
    }
    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom, 18px);
    }
    .line-playing {
      border-color: #3b82f6 !important;
      background-color: rgba(59, 130, 246, 0.15) !important;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.4);
      transform: translateY(-1px);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen flex flex-col justify-between selection:bg-blue-600 selection:text-white">

  <header class="safe-top bg-slate-900/95 backdrop-blur-md sticky top-0 z-30 border-b border-slate-800 px-4 pt-3 pb-2.5">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center font-extrabold text-white text-sm shadow-md shadow-blue-500/20">
          30
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="text-sm font-bold tracking-tight text-white">Daily English</h1>
            <span id="todayBadgeIndicator" class="text-[10px] font-bold px-1.5 py-0.2 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">오늘의 학습</span>
          </div>
          <p id="calendarDateDisplay" class="text-[11px] text-slate-400">자동 일차 계산 중...</p>

      <!-- Streak & Settings Actions -->
      <div class="flex items-center gap-1.5">
        <div class="flex items-center gap-1 px-2.5 py-1 rounded-xl bg-slate-800 border border-slate-700 text-xs font-semibold text-amber-400">
          <svg class="w-3.5 h-3.5 fill-current text-amber-400" viewBox="0 0 24 24">
            <path d="M12.9 2.1c.3.5.3 1.1 0 1.6-1.4 2.2-1.9 3.8-1.9 5.3 0 1.9 1.1 3.5 2.7 4.3.4.2.7.6.7 1 0 .7-.6 1.3-1.3 1.3-.2 0-.4 0-.6-.1-2.4-1-3.9-3.4-3.9-6 0-1.7.6-3.7 1.8-5.7.5-.8 1.7-1.3 2.5-.4zm4.6 6.3c.3.5.2 1.1-.2 1.5-1.9 1.9-2.7 3.5-2.7 5.1 0 2.2 1.4 4.1 3.4 4.8.4.1.7.5.7.9 0 .6-.5 1.1-1.1 1.1-.3 0-.6-.1-.8-.2-2.8-1.1-4.7-3.8-4.7-6.9 0-2.1 1-4.2 2.9-6.5.6-.7 1.7-.6 2.5.2z"/>
          </svg>
          <span id="streakDisplay">0일</span>
        </div>
        <button onclick="toggleSettingsModal()" class="p-2 rounded-xl bg-slate-800 text-slate-300 hover:text-white border border-slate-700" title="설정">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 30-Day Horizontal Scroll Carousel -->
    <div class="max-w-md mx-auto mt-2.5 flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1" id="dayPillsContainer">
      <!-- Generated 30 Days dynamically via JavaScript -->
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="max-w-md mx-auto w-full px-4 pt-3.5 pb-24 flex-1">

    <!-- Active Lesson Card Banner -->
    <div class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 border border-slate-700/80 rounded-3xl p-4 mb-3.5 shadow-md relative overflow-hidden">
      <div class="flex items-start justify-between gap-2">
        <div class="flex-1 pr-1">
          <div class="flex items-center gap-2">
            <span id="lessonBadge" class="text-[11px] font-extrabold text-blue-400 uppercase tracking-wider">Day 1</span>
            <span id="autoTodayTag" class="text-[10px] bg-blue-500/20 text-blue-300 px-2 py-0.2 rounded-md font-semibold border border-blue-500/30 hidden">오늘 날짜 진도</span>
          </div>
          <h2 id="lessonTitle" class="text-base font-bold text-white mt-1 leading-snug">로딩 중...</h2>
          <p id="lessonSubtitle" class="text-xs text-slate-400 mt-0.5 leading-relaxed">대화 상황 설명을 불러오는 중입니다.</p>
        </div>

        <button id="completeBtn" onclick="toggleLessonCompletion()" class="shrink-0 p-2.5 rounded-2xl border transition-all text-xs font-semibold flex flex-col items-center justify-center gap-1 bg-slate-800 border-slate-700 text-slate-300 active:scale-95 shadow-sm min-w-[72px]">

            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
          </svg>
          <span id="completeBtnText" class="text-[10px]">완료 체크</span>
        </button>
      </div>

      <!-- Controls: Audio, Speed & Display Toggles -->
      <div class="mt-3.5 pt-3 border-t border-slate-700/60 flex flex-wrap items-center justify-between gap-2 text-xs">
        <div class="flex items-center gap-2.5">
          <label class="flex items-center gap-1.5 cursor-pointer text-slate-300">
            <input type="checkbox" id="toggleTrans" checked onchange="toggleViewSettings()" class="rounded bg-slate-800 border-slate-700 text-blue-600 focus:ring-0 w-3.5 h-3.5" />
            <span class="font-medium text-[11px]">해석</span>
          </label>
          <label class="flex items-center gap-1.5 cursor-pointer text-slate-300">
            <input type="checkbox" id="togglePronunciation" checked onchange="toggleViewSettings()" class="rounded bg-slate-800 border-slate-700 text-blue-600 focus:ring-0 w-3.5 h-3.5" />
            <span class="font-medium text-[11px]">연음 팁</span>
          </label>
          <div class="flex items-center bg-slate-800 rounded-lg p-0.5 border border-slate-700 text-[11px]">
            <button onclick="setTtsSpeed(0.8)" id="speedBtn-0.8" class="px-1.5 py-0.5 rounded text-slate-400">0.8x</button>
            <button onclick="setTtsSpeed(0.9)" id="speedBtn-0.9" class="px-1.5 py-0.5 rounded bg-blue-600 text-white font-bold">0.9x</button>
            <button onclick="setTtsSpeed(1.0)" id="speedBtn-1.0" class="px-1.5 py-0.5 rounded text-slate-400">1.0x</button>
          </div>
        </div>

        <button onclick="autoplayDialogue()" id="autoplayBtn" class="flex items-center gap-1.5 bg-blue-600/20 border border-blue-500/40 hover:bg-blue-600/30 text-blue-300 font-bold px-2.5 py-1.5 rounded-xl transition-all active:scale-95 text-[11px]">

          </svg>
          <span id="autoplayText">전체 연속 듣기</span>
        </button>
      </div>
    </div>

    <!-- 3 Core Learning Tabs -->
    <div class="grid grid-cols-3 gap-1 bg-slate-900/90 p-1 rounded-2xl border border-slate-800 mb-3.5">
      <button onclick="switchTab('dialogue')" id="tabBtn-dialogue" class="py-2 text-xs font-bold rounded-xl transition-all text-white bg-blue-600 shadow-sm">
        다이얼로그 & 연음
      </button>
      <button onclick="switchTab('expressions')" id="tabBtn-expressions" class="py-2 text-xs font-bold rounded-xl transition-all text-slate-400 hover:text-slate-200">
        핵심 표현 (3)
      </button>
      <button onclick="switchTab('quiz')" id="tabBtn-quiz" class="py-2 text-xs font-bold rounded-xl transition-all text-slate-400 hover:text-slate-200">
        빈칸 퀴즈 (2~3)
      </button>
    </div>

    <!-- Section 1: Dialogue Cards -->
    <section id="tab-dialogue" class="space-y-3">
      <div id="dialogueList" class="space-y-3">
        <!-- Injected via JavaScript -->
      </div>
    </section>

    <!-- Section 2: Key Expressions -->
    <section id="tab-expressions" class="space-y-3 hidden">
      <div id="expressionsList" class="space-y-3">
        <!-- Injected via JavaScript -->
      </div>
    </section>

    <!-- Section 3: Interactive Quiz -->
    <section id="tab-quiz" class="space-y-3.5 hidden">
      <div class="p-3.5 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-between">
        <div>
          <h3 class="text-xs font-bold text-white">오늘의 핵심 문장 복습 퀴즈</h3>
          <p class="text-[11px] text-slate-400">빈칸에 들어갈 표현을 적고 확인해 보세요.</p>
        </div>
        <button onclick="resetQuiz()" class="text-xs text-blue-400 hover:text-blue-300 underline font-medium">초기화</button>
      </div>
      <div id="quizList" class="space-y-3">
        <!-- Injected via JavaScript -->
      </div>
    </section>
  </main>

  <!-- Bottom Navigation Status -->
  <footer class="safe-bottom fixed bottom-0 left-0 right-0 z-20 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 px-4 py-2">
    <div class="max-w-md mx-auto flex items-center justify-between text-xs text-slate-400">
      <div class="flex items-center gap-2">
        <button onclick="jumpToCalculatedToday()" class="px-2.5 py-1 rounded-lg bg-blue-600/20 border border-blue-500/30 text-blue-300 font-semibold hover:bg-blue-600/30 transition-all flex items-center gap-1 text-[11px]">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>

          <span>오늘 날짜로 이동</span>

      </div>
      <div class="flex items-center gap-1.5 text-[11px]">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-400"></span>
        <span id="pwaStatusText">30일 풀 데이터 내장됨</span>
      </div>
    </div>
  </footer>

  <!-- Settings & Date Setup Modal -->
  <div id="settingsModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-5 text-slate-200 shadow-2xl">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800">
        <h3 class="text-sm font-bold text-white">학습 설정 & 루틴 기준일</h3>
        <button onclick="toggleSettingsModal()" class="text-slate-400 hover:text-white p-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <div class="mt-4 space-y-3.5 text-xs">
        <div>
          <label class="text-slate-300 font-semibold block mb-1">학습 시작일 (Day 1 시작 기준)</label>
          <input type="date" id="settingsStartDateInput" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-white text-xs outline-none focus:border-blue-500" />
          <p class="text-[11px] text-slate-400 mt-1">이 날짜를 기준으로 매일 자정마다 다음 Day로 자동 넘어갑니다.</p>
        </div>

        <div class="pt-2 flex flex-col gap-2">
          <button onclick="setTodayAsDayOne()" class="w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 font-bold text-white text-xs transition-all">
            오늘을 Day 1로 다시 지정하기
          </button>
          <button onclick="clearAllProgressData()" class="w-full py-2 rounded-xl bg-slate-800 hover:bg-rose-900/30 text-rose-300 border border-slate-700 font-medium text-xs transition-all">
            학습 완료 기록 초기화
          </button>
        </div>
      </div>
    </div>
  </div>

    /* Procedurally populate Days 11-30 with high-impact workplace dialogues */
    TOPICS_REMAINDER.forEach(item => {
      LESSONS_MASTER.push({

          { speaker: "B", name: "Jordan", text: "Not really, as long as we keep the lines of communication open.", ipa: "[nɑːt ˈriːəli, æz lɔːŋ æz wiː kiːp ðə laɪnz əv kəˌmjuːnɪˈkeɪʃn ˈoʊpən]", linking: "as long as는 [애즈-롱-애즈], lines of는 [라인-저브]로 연음됩니다.", trans: "서로 소통만 원활히 열어둔다면 큰 문제는 없을 것 같아요." },
          { speaker: "A", name: "Alex", text: "Great. Let's touch base again towards the end of the week.", ipa: "[ɡreɪt. lets tʌtʃ beɪs əˈɡen təˈwɔːrdz ði end əv ðə wiːk]", linking: "touch base again은 [터치-베이스-어겐], end of the는 [엔-더브-더]입니다.", trans: "좋아요. 이번 주 후반부에 다시 한번 상황 체크하시죠." },
          { speaker: "B", name: "Jordan", text: "Deal. I will keep you posted on any new developments.", ipa: "[diːl. aɪ wɪl kiːp juː ˈpoʊstɪd ɑːn ˈeni nuː dɪˈveləpmənts]", linking: "keep you는 [키-퓨], posted on은 [포스티-단]으로 소리 납니다.", trans: "그러시죠. 새로운 진척 생기면 계속 공유해 드릴게요." }
        ],
        expressions: [
          { phrase: "on the same page", meaning: "(어떤 사안에 대해) 생각이나 이해가 일치하는", example: "Let's review the brief so we are all on the same page." },
          { phrase: "keep someone posted", meaning: "누군가에게 계속해서 최근 상황을 공유해주다", example: "I will keep you posted as soon as the client responds." },
          { phrase: "take a quick look", meaning: "신속하게 훑어보다/확인하다", example: "Can you take a quick look at this contract?" }
        ],
        quizzes: [
          { question: "모두가 같은 생각과 이해를 공유하도록 '일치시키다'고 할 때:", prompt: "Make sure all stakeholders are ____ ____ ____ ____.", answers: ["on the same page"], hint: "on + the + same + page" },
          { question: "진행 상황을 상대방에게 '계속 알려주다/공유하다'고 할 때:", prompt: "Thanks! Please ____ me ____ on the outcome.", answers: ["keep posted", "keep me posted"], hint: "keep + posted" }
        ]
      });
    });

    /* State Management */
    let currentLessonIndex = 0;
    let autoCalculatedDayIndex = 0;
    let currentTab = 'dialogue';
    let ttsSpeed = 0.9;
    let isAutoplaying = false;
    let autoplayTimeout = null;

    let showTranslations = true;
    let showPronunciation = true;

    const LS_START_DATE_KEY = 'daily30_start_anchor_date';
    const LS_COMPLETED_KEY = 'daily30_completed_map';
    const LS_STREAK_KEY = 'daily30_streak_count';

    /* App Initialization */
    window.addEventListener('DOMContentLoaded', () => {
      initDateAnchor();
      calculateTodayLessonIndex();
      renderDayCarousel();
      loadLesson(autoCalculatedDayIndex);
      updateStreakUI();
    });

    /* 1. Date Calibration & Automatic Progression Core */
    function initDateAnchor() {
      let anchor = localStorage.getItem(LS_START_DATE_KEY);
      if (!anchor) {
        // First-time user default anchor: today at 00:00:00
        const todayStr = getLocalDateString(new Date());
        localStorage.setItem(LS_START_DATE_KEY, todayStr);
        anchor = todayStr;
      }
      document.getElementById('settingsStartDateInput').value = anchor;
    }

    function getLocalDateString(dateObj) {
      const year = dateObj.getFullYear();
      const month = String(dateObj.getMonth() + 1).padStart(2, '0');
      const day = String(dateObj.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function calculateTodayLessonIndex() {
      const anchorStr = localStorage.getItem(LS_START_DATE_KEY) || getLocalDateString(new Date());
      const startDate = new Date(anchorStr + "T00:00:00");
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const diffTime = today.getTime() - startDate.getTime();
      const diffDays = Math.max(0, Math.floor(diffTime / (1000 * 60 * 60 * 24)));
      
      // Auto cycle across 30 days: (diffDays % 30)
      autoCalculatedDayIndex = diffDays % 30;

      const dateDisplay = document.getElementById('calendarDateDisplay');
      const formattedToday = `${today.getMonth() + 1}월 ${today.getDate()}일`;
      dateDisplay.textContent = `${formattedToday} 기준 • Day ${autoCalculatedDayIndex + 1} 배정됨`;
    }

    function jumpToCalculatedToday() {
      calculateTodayLessonIndex();
      loadLesson(autoCalculatedDayIndex);
      // Scroll carousel to active item
      const activePill = document.getElementById(`pill-day-${autoCalculatedDayIndex}`);
      if (activePill) activePill.scrollIntoView({ behavior: 'smooth', inline: 'center' });
    }

    /* 2. UI Carousel & Lesson Rendering */
    function renderDayCarousel() {
      const container = document.getElementById('dayPillsContainer');
      container.innerHTML = '';
      const completedMap = getCompletedLessons();

      LESSONS_MASTER.forEach((lesson, idx) => {
        const isSelected = idx === currentLessonIndex;
        const isTodayAuto = idx === autoCalculatedDayIndex;
        const isCompleted = !!completedMap[lesson.id];

        const pill = document.createElement('button');
        pill.id = `pill-day-${idx}`;
        pill.className = `shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold transition-all flex items-center gap-1 ${
          isSelected
            ? 'bg-blue-600 text-white shadow-md shadow-blue-500/30 ring-1 ring-blue-400'
            : isTodayAuto 
              ? 'bg-slate-800 border border-emerald-500/50 text-emerald-300' 
              : 'bg-slate-900 border border-slate-800 text-slate-400 hover:bg-slate-800 hover:text-slate-200'
        }`;

        pill.onclick = () => loadLesson(idx);

        let badge = '';
        if (isCompleted) {
          badge = `<svg class="w-3.5 h-3.5 text-emerald-400 fill-current" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>`;
        } else if (isTodayAuto) {
          badge = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>`;
        }

        pill.innerHTML = `<span>Day ${lesson.dayNum}</span> ${badge}`;
        container.appendChild(pill);
      });
    }

    function loadLesson(index) {
      stopAutoplay();
      currentLessonIndex = index;
      const lesson = LESSONS_MASTER[index];

      document.getElementById('lessonBadge').textContent = `Day ${lesson.dayNum} • ${lesson.category}`;
      document.getElementById('lessonTitle').textContent = lesson.title;
      document.getElementById('lessonSubtitle').textContent = lesson.subtitle;

      const isToday = index === autoCalculatedDayIndex;
      const todayTag = document.getElementById('autoTodayTag');
      if (todayTag) todayTag.classList.toggle('hidden', !isToday);

      updateCompleteBtnUI();
      renderDialoguesUI(lesson.dialogues);
      renderExpressionsUI(lesson.expressions);
      renderQuizUI(lesson.quizzes);
      renderDayCarousel();
    }

    function renderDialoguesUI(lines) {
      const container = document.getElementById('dialogueList');
      container.innerHTML = '';

      lines.forEach((line, idx) => {
        const card = document.createElement('div');
        card.id = `dialogue-card-${idx}`;
        card.className = `p-3.5 rounded-2xl border transition-all duration-200 ${
          line.speaker === 'A'
            ? 'bg-slate-900/90 border-slate-800'
            : 'bg-slate-850 bg-slate-900 border-slate-750 border-slate-700/70'
        }`;

        card.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <div class="flex items-center gap-2">
              <span class="w-6 h-6 rounded-lg text-xs font-bold flex items-center justify-center shrink-0 ${
                line.speaker === 'A' 
                  ? 'bg-blue-600/30 text-blue-300 border border-blue-500/40' 
                  : 'bg-indigo-600/30 text-indigo-300 border border-indigo-500/40'
              }">${line.speaker}</span>
              <span class="text-xs font-bold text-slate-300">${line.name}</span>
            </div>
            <button onclick="speakSingleSentence(${idx})" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 active:scale-95 transition-all shadow-sm" title="음성 듣기">
              <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
              </svg>
            </button>
          </div>

          <!-- English Sentence -->
          <div class="mt-2 text-sm font-semibold text-white tracking-wide leading-relaxed">
            ${line.text}
          </div>

          <!-- Connected Speech & Pronunciation Section -->
          <div class="line-pronunciation-group mt-2 space-y-1.5 ${showPronunciation ? '' : 'hidden'}">
            <div class="text-[11px] text-blue-400 font-mono bg-blue-950/40 px-2 py-0.5 rounded border border-blue-900/50 inline-block">
              ${line.ipa}
            </div>
            <div class="text-xs text-amber-200/90 bg-amber-500/10 border border-amber-500/20 rounded-xl p-2.5 flex items-start gap-2">
              <span class="text-amber-400 font-bold shrink-0 text-[10px] px-1.5 py-0.5 rounded bg-amber-400/20 border border-amber-400/30">연음</span>
              <span class="leading-relaxed text-[11px]">${line.linking}</span>
            </div>
          </div>

          <!-- Korean Translation -->
          <div class="line-trans text-xs text-slate-400 mt-2 pt-2 border-t border-slate-800/80 leading-relaxed ${showTranslations ? '' : 'hidden'}">
            ${line.trans}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderExpressionsUI(expressions) {
      const container = document.getElementById('expressionsList');
      container.innerHTML = '';

      expressions.forEach(item => {
        const box = document.createElement('div');
        box.className = 'p-3.5 rounded-2xl bg-slate-900 border border-slate-800 space-y-1.5';
        box.innerHTML = `
          <div class="flex items-baseline justify-between gap-2">
            <h4 class="text-sm font-bold text-blue-400">${item.phrase}</h4>
            <span class="text-xs text-slate-300 font-medium">${item.meaning}</span>
          </div>
          <div class="text-xs bg-slate-950 p-2.5 rounded-xl border border-slate-800/80 text-slate-300 leading-relaxed">
            <span class="text-slate-500 font-bold mr-1">예문:</span> "${item.example}"
          </div>
        `;
        container.appendChild(box);
      });
    }

    function renderQuizUI(quizzes) {
      const container = document.getElementById('quizList');
      container.innerHTML = '';

      quizzes.forEach((quiz, idx) => {
        const box = document.createElement('div');
        box.className = 'p-3.5 rounded-2xl bg-slate-900 border border-slate-800 space-y-2';
        box.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <span class="text-[11px] font-bold text-blue-400">문제 ${idx + 1}</span>
            <button onclick="toggleHint(${idx})" class="text-[11px] text-amber-400/90 hover:underline">힌트 보기</button>
          </div>
          <p class="text-xs text-slate-300">${quiz.question}</p>
          <div class="p-2 bg-slate-950 rounded-xl border border-slate-800 font-mono text-xs text-amber-300">
            ${quiz.prompt}
          </div>
          <div id="hint-box-${idx}" class="text-[11px] text-amber-300 bg-amber-500/10 p-2 rounded-xl border border-amber-500/20 hidden">
            힌트: ${quiz.hint}
          </div>
          <div class="flex gap-2 pt-1">
            <input type="text" id="quiz-in-${idx}" placeholder="정답 입력..." class="flex-1 bg-slate-950 border border-slate-700 text-white text-xs px-3 py-2 rounded-xl outline-none focus:border-blue-500" />
            <button onclick="submitQuiz(${idx})" class="px-3 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 font-bold text-xs text-white">확인</button>
          </div>
          <div id="quiz-result-${idx}" class="text-xs font-semibold hidden pt-1"></div>
        `;
        container.appendChild(box);
      });
    }

    function toggleHint(idx) {
      const h = document.getElementById(`hint-box-${idx}`);
      if (h) h.classList.toggle('hidden');
    }

    function submitQuiz(idx) {
      const input = document.getElementById(`quiz-in-${idx}`);
      const res = document.getElementById(`quiz-result-${idx}`);
      const quiz = LESSONS_MASTER[currentLessonIndex].quizzes[idx];

      const val = input.value.trim().toLowerCase();
      const isOk = quiz.answers.some(ans => ans.toLowerCase() === val);

      res.classList.remove('hidden', 'text-emerald-400', 'text-rose-400');
      if (isOk) {
        res.classList.add('text-emerald-400');
        res.innerHTML = "✓ 정답입니다! 아주 잘하셨어요.";
      } else {
        res.classList.add('text-rose-400');
        res.innerHTML = `✗ 아쉬워요! 정답: <strong>${quiz.answers[0]}</strong>`;
      }
    }

    function resetQuiz() {
      renderQuizUI(LESSONS_MASTER[currentLessonIndex].quizzes);
    }

    /* 3. Audio & Web Speech API Core */
    function getSpeakerVoice(speaker) {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices().filter(v => v.lang.startsWith('en'));
      if (!voices.length) return null;
      if (speaker === 'B' && voices.length > 1) return voices[1];
      return voices[0];
    }

    function setTtsSpeed(speed) {
      ttsSpeed = speed;
      [0.8, 0.9, 1.0].forEach(s => {
        const b = document.getElementById(`speedBtn-${s}`);
        if (s === speed) {
          b.className = 'px-1.5 py-0.5 rounded bg-blue-600 text-white font-bold';
        } else {
          b.className = 'px-1.5 py-0.5 rounded text-slate-400';
        }
      });
    }

    function speakSingleSentence(index, callback) {
      if (!('speechSynthesis' in window)) {
        if (callback) callback();
        return;
      }

      window.speechSynthesis.cancel();
      const line = LESSONS_MASTER[currentLessonIndex].dialogues[index];
      const utter = new SpeechSynthesisUtterance(line.text);
      utter.lang = 'en-US';
      utter.rate = ttsSpeed;
      utter.pitch = (line.speaker === 'B') ? 1.08 : 0.96; // Distinct voice tone for speaker B

      const voice = getSpeakerVoice(line.speaker);
      if (voice) utter.voice = voice;

      highlightLineCard(index);

      utter.onend = () => {
        unhighlightLineCard(index);
        if (callback) callback();
      };
      utter.onerror = () => {
        unhighlightLineCard(index);
        if (callback) callback();
      };

      window.speechSynthesis.speak(utter);
    }

    function highlightLineCard(idx) {
      document.querySelectorAll('#dialogueList > div').forEach(d => d.classList.remove('line-playing'));
      const target = document.getElementById(`dialogue-card-${idx}`);
      if (target) {
        target.classList.add('line-playing');
        target.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function unhighlightLineCard(idx) {
      const target = document.getElementById(`dialogue-card-${idx}`);
      if (target) target.classList.remove('line-playing');
    }

    function autoplayDialogue() {
      if (isAutoplaying) {
        stopAutoplay();
        return;
      }

      isAutoplaying = true;
      document.getElementById('autoplayBtn').classList.add('bg-blue-600', 'text-white');
      document.getElementById('autoplayText').textContent = '재생 중지';

      const lines = LESSONS_MASTER[currentLessonIndex].dialogues;
      let cur = 0;

      function step() {
        if (!isAutoplaying || cur >= lines.length) {
          stopAutoplay();
          return;
        }

        speakSingleSentence(cur, () => {
          cur++;
          if (cur < lines.length && isAutoplaying) {
            autoplayTimeout = setTimeout(step, 600);
          } else {
            stopAutoplay();
          }
        });
      }

      step();
    }

    function stopAutoplay() {
      isAutoplaying = false;
      if (autoplayTimeout) clearTimeout(autoplayTimeout);
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();

      document.querySelectorAll('#dialogueList > div').forEach(d => d.classList.remove('line-playing'));
      const btn = document.getElementById('autoplayBtn');
      if (btn) {
        btn.classList.remove('bg-blue-600', 'text-white');
        document.getElementById('autoplayText').textContent = '전체 연속 듣기';
      }
    }

    /* 4. Toggles & Tab Navigation */
    function toggleViewSettings() {
      showTranslations = document.getElementById('toggleTrans').checked;
      showPronunciation = document.getElementById('togglePronunciation').checked;

      document.querySelectorAll('.line-trans').forEach(el => el.classList.toggle('hidden', !showTranslations));
      document.querySelectorAll('.line-pronunciation-group').forEach(el => el.classList.toggle('hidden', !showPronunciation));
    }

    function switchTab(tab) {
      currentTab = tab;
      ['dialogue', 'expressions', 'quiz'].forEach(t => {
        const btn = document.getElementById(`tabBtn-${t}`);
        const sec = document.getElementById(`tab-${t}`);
        if (t === tab) {
          btn.className = 'py-2 text-xs font-bold rounded-xl transition-all text-white bg-blue-600 shadow-sm';
          sec.classList.remove('hidden');
        } else {
          btn.className = 'py-2 text-xs font-bold rounded-xl transition-all text-slate-400 hover:text-slate-200';
          sec.classList.add('hidden');
        }
      });
    }

    /* 5. Completion & Streak Persistence */
    function getCompletedLessons() {
      try {
        return JSON.parse(localStorage.getItem(LS_COMPLETED_KEY)) || {};
      } catch (e) {
        return {};
      }
    }

    function toggleLessonCompletion() {
      const lesson = LESSONS_MASTER[currentLessonIndex];
      const completed = getCompletedLessons();

      if (completed[lesson.id]) {
        delete completed[lesson.id];
      } else {
        completed[lesson.id] = new Date().toISOString();
        registerStreakActivity();
      }

      localStorage.setItem(LS_COMPLETED_KEY, JSON.stringify(completed));
      updateCompleteBtnUI();
      renderDayCarousel();
      updateStreakUI();
    }

    function updateCompleteBtnUI() {
      const lesson = LESSONS_MASTER[currentLessonIndex];
      const completed = getCompletedLessons();
      const isDone = !!completed[lesson.id];

      const btn = document.getElementById('completeBtn');
      const text = document.getElementById('completeBtnText');
      const icon = document.getElementById('completeCheckIcon');

      if (isDone) {
        btn.className = 'shrink-0 p-2.5 rounded-2xl border transition-all text-xs font-semibold flex flex-col items-center justify-center gap-1 bg-emerald-500/20 border-emerald-500/40 text-emerald-300 active:scale-95 shadow-sm min-w-[72px]';
        text.textContent = '학습 완료';
        icon.className = 'w-4 h-4 text-emerald-400';
      } else {
        btn.className = 'shrink-0 p-2.5 rounded-2xl border transition-all text-xs font-semibold flex flex-col items-center justify-center gap-1 bg-slate-800 border-slate-700 text-slate-300 active:scale-95 shadow-sm min-w-[72px]';
        text.textContent = '완료 체크';
        icon.className = 'w-4 h-4 text-slate-400';
      }
    }

    function registerStreakActivity() {
      const todayStr = getLocalDateString(new Date());
      let streakData = { count: 0, lastDate: '' };
      try {
        streakData = JSON.parse(localStorage.getItem(LS_STREAK_KEY)) || streakData;
      } catch (e) {}

      if (streakData.lastDate === todayStr) return;

      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      const yestStr = getLocalDateString(yesterday);

      if (streakData.lastDate === yestStr) {
        streakData.count += 1;
      } else {
        streakData.count = 1;
      }
      streakData.lastDate = todayStr;
      localStorage.setItem(LS_STREAK_KEY, JSON.stringify(streakData));
    }

    function updateStreakUI() {
      let streakData = { count: 0 };
      try {
        streakData = JSON.parse(localStorage.getItem(LS_STREAK_KEY)) || streakData;
      } catch (e) {}
      document.getElementById('streakDisplay').textContent = `${streakData.count || 0}일`;
    }

    /* 6. Settings Modal & Re-calibration */
    function toggleSettingsModal() {
      document.getElementById('settingsModal').classList.toggle('hidden');
    }

    function setTodayAsDayOne() {
      const todayStr = getLocalDateString(new Date());
      localStorage.setItem(LS_START_DATE_KEY, todayStr);
      document.getElementById('settingsStartDateInput').value = todayStr;
      calculateTodayLessonIndex();
      loadLesson(autoCalculatedDayIndex);
      toggleSettingsModal();
    }

    function clearAllProgressData() {
      localStorage.removeItem(LS_COMPLETED_KEY);
      localStorage.removeItem(LS_STREAK_KEY);
      updateCompleteBtnUI();
      renderDayCarousel();
      updateStreakUI();
      toggleSettingsModal();
    }

    // Handle manual date picker changes
    document.getElementById('settingsStartDateInput')?.addEventListener('change', (e) => {
      if (e.target.value) {
        localStorage.setItem(LS_START_DATE_KEY, e.target.value);
        calculateTodayLessonIndex();
        loadLesson(autoCalculatedDayIndex);
      }
    });
  </script>
</body>
</html>
